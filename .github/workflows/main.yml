name: Build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    linux:
        timeout-minutes: 60
        runs-on: ubuntu-26.10

        steps:
        - uses: actions/checkout@v4

        - name: Setup
          run: |
            sudo apt-get update
            sudo apt-get install libglfw3-dev

        - name: Linux
          env:
            CC: gcc
            CXX: g++
          run: |
            make -j 4

    windows:
        timeout-minutes: 60
        runs-on: windows-latest

        steps:
        - uses: actions/checkout@v4

        - name: Setup MSYS2 (UCRT64) and dependencies
          uses: msys2/setup-msys2@v2
          with:
            msystem: UCRT64
            update: true
            install: >-
              mingw-w64-ucrt-x86_64-toolchain
              mingw-w64-ucrt-x86_64-pkgconf
              mingw-w64-ucrt-x86_64-glfw
              mingw-w64-ucrt-x86_64-zlib
              make

        - name: Build (MinGW)
          shell: msys2 {0}
          env:
            CC: gcc
            CXX: g++
          run: |
            make -j 4
